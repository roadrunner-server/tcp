version: '3'

server:
  command: "php php_test_files/psr-worker-tcp-cont.php"

tcp:
  servers:
    server1:
      addr: 127.0.0.1:7778
      delimiter: "\r\n"
    server2:
      addr: 127.0.0.1:8811
    server3:
      addr: 127.0.0.1:8812
      delimiter: "\r\n"

  pool:
    num_workers: 5
    allocate_timeout: 60s

endure:
  grace_period: 10s
